[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Lunar
Author=Lunar contributors
Information=Offline Moon phases and local lunar events. Notifications are opt-in visual alerts.
Version=0.1.2
License=MIT

[Variables]
; Defaults also cover upgrades that retain an older Settings.inc.
BackgroundOpacity=200
CornerRadius=20
@Include=#@#Settings.inc

[MeasureLunar]
Measure=Script
ScriptFile=#@#Scripts\Widget.lua

[TextStyle]
FontFace=Segoe UI
FontColor=231,234,241,#Opacity#
FontSize=(11*#Scale#)
AntiAlias=1
StringAlign=Center
X=(180*#Scale#)
W=(348*#Scale#)
H=(28*#Scale#)
ClipString=1
DynamicVariables=1
UpdateDivider=-1

[MeterBounds]
Meter=Shape
W=(360*#Scale#)
H=(550*#Scale#)
Shape=Rectangle 0,0,(360*#Scale#),(550*#Scale#),(#CornerRadius#*#Scale#) | Fill Color 18,20,28,#BackgroundOpacity# | StrokeWidth 0
DynamicVariables=1
UpdateDivider=-1

[MeterTitle]
Meter=String
MeterStyle=TextStyle
Y=(18*#Scale#)
FontSize=(9*#Scale#)
FontColor=144,155,177,#Opacity#
Text=MOON PHASE

[MeterMoon]
Meter=Image
ImageName=#@#Images\moon-060.png
X=(84*#Scale#)
Y=(54*#Scale#)
W=(192*#Scale#)
H=(192*#Scale#)
ImageAlpha=#Opacity#
DynamicVariables=1
UpdateDivider=-1

[NavigationStyle]
MeterStyle=TextStyle
Y=(45*#Scale#)
H=(30*#Scale#)
SolidColor=0,0,0,1

[MeterBack]
Meter=String
MeterStyle=TextStyle | NavigationStyle
X=(30*#Scale#)
W=(38*#Scale#)
FontSize=(22*#Scale#)
Text=[\8249]
LeftMouseUpAction=[!CommandMeasure MeasureLunar PreviousDay()]

[MeterBrowseDate]
Meter=String
MeterStyle=TextStyle | NavigationStyle
X=(165*#Scale#)
Y=(51*#Scale#)
W=(184*#Scale#)
FontSize=(10*#Scale#)
Text=

[MeterToday]
Meter=String
MeterStyle=TextStyle | NavigationStyle
X=(278*#Scale#)
Y=(51*#Scale#)
W=(58*#Scale#)
FontSize=(9*#Scale#)
FontColor=155,178,211,#Opacity#
Text=Today
LeftMouseUpAction=[!CommandMeasure MeasureLunar Today()]

[MeterForward]
Meter=String
MeterStyle=TextStyle | NavigationStyle
X=(330*#Scale#)
W=(38*#Scale#)
FontSize=(22*#Scale#)
Text=[\8250]
LeftMouseUpAction=[!CommandMeasure MeasureLunar NextDay()]

[MeterPhase]
Meter=String
MeterStyle=TextStyle
Y=(264*#Scale#)
FontSize=(21*#Scale#)
H=(36*#Scale#)
Text=Lunar

[MeterIllumination]
Meter=String
MeterStyle=TextStyle
Y=(301*#Scale#)
FontSize=(10*#Scale#)
FontColor=155,166,188,#Opacity#
Text=...

[MeterDivider]
Meter=Shape
Shape=Line (110*#Scale#),(329*#Scale#),(250*#Scale#),(329*#Scale#) | StrokeWidth 1 | Stroke Color 115,131,160,55
DynamicVariables=1
UpdateDivider=-1

[MeterNextLabel]
Meter=String
MeterStyle=TextStyle
Y=(347*#Scale#)
FontSize=(9*#Scale#)
FontColor=144,155,177,#Opacity#
Text=NEXT FULL MOON

[MeterNextDate]
Meter=String
MeterStyle=TextStyle
Y=(373*#Scale#)
FontSize=(10*#Scale#)
Text=...

[MeterCountdown]
Meter=String
MeterStyle=TextStyle
Y=(404*#Scale#)
FontSize=(15*#Scale#)
FontColor=190,209,238,#Opacity#
Text=...

[MeterPrevious]
Meter=String
MeterStyle=TextStyle
Y=(450*#Scale#)
FontSize=(9*#Scale#)
Text=

[MeterUpcoming]
Meter=String
MeterStyle=TextStyle
Y=(475*#Scale#)
FontSize=(9*#Scale#)
Text=

[MeterAlert]
Meter=String
MeterStyle=TextStyle
Y=(510*#Scale#)
H=(68*#Scale#)
FontSize=(10*#Scale#)
FontColor=230,203,143,#Opacity#
ClipString=2
Hidden=1
Text=
LeftMouseUpAction=[!CommandMeasure MeasureLunar Dismiss()]
ToolTipText=Click to dismiss
